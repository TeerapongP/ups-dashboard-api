name: CI/CD (Docker → Server via SSH)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ups-dashboard   # เปลี่ยนชื่อ image ได้ตามต้องการ

jobs:
  # (ถ้ามี test/lint ให้เพิ่มที่นี่ได้; ด้านล่างคือตัวอย่างสั้นๆ สำหรับ Node/Python — เลือกใช้ตามโปรเจกต์)
  # node-test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: 'pnpm'
  #     - uses: pnpm/action-setup@v2
  #       with:
  #         version: 10.11.0
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm lint && pnpm test --if-present

  # python-test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.11'
  #         cache: 'pip'
  #     - run: |
  #         python -m pip install --upgrade pip
  #         pip install -r requirements.txt
  #         pytest -q || true

  build-and-push:
    # needs: [node-test, python-test]   # เปิดเมื่อมี job test ด้านบน
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha

      - name: Build & Push (cache GHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}          # เช่น 158.108.196.162 หรือ IP ภายในมหาลัย
          username: ${{ secrets.SERVER_USER }}      # user ที่อยู่ในกลุ่ม docker
          key: ${{ secrets.SERVER_SSH_KEY }}        # private key (รูปแบบ OpenSSH)
          script: |
            set -e
            cd /srv/ups-dashboard
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker compose pull
            docker compose up -d
            docker image prune -f

  pr-comment:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ Image built & pushed successfully.\nTags: `${{ needs.build-and-push.outputs?.tags || 'see action logs' }}`"
            })
